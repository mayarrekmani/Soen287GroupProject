<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Block / Unblock Resources</title>
    <link rel="stylesheet" href="projectStyle.css" />
    <style>
      body {
        background-color: #f5f5f5;
        color: #222;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 32px;
      }

      .site-header {
        background-color: #5e001f;
        color: #fff;
        border-bottom: 4px solid #c9a646;
        padding: 12px 24px;
        display: flex;
        gap: 12px;
        margin: -32px -32px 24px -32px;
        align-items: center;
      }
      .site-header img {
        height: 48px;
      }

      h1 {
        text-align: center;
        color: #5e001f;
        margin-top: 10px;
        margin-bottom: 20px;
        font-size: 1.8rem;
      }

      .resourceRow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 500px;
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px 16px;
        margin: 10px auto;
        font-weight: 600;
      }

      .statusBtn {
        background-color: #fff;
        color: #5e001f;
        border: 1px solid #5e001f;
        border-radius: 4px;
        padding: 6px 14px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .statusBtn:hover {
        background-color: #5e001f;
        color: #fff;
        box-shadow: 0 4px 10px rgba(94, 0, 31, 0.3);
      }

      .tag {
        font-size: 0.75rem;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid #bbb;
        margin-left: 8px;
      }

      .tag.blocked {
        background-color: #ffe6e6;
        border-color: #cc0000;
        color: #cc0000;
      }
      .tag.active {
        background-color: #e6ffe9;
        border-color: #1e7b3a;
        color: #1e7b3a;
      }

      #goBack {
        display: block;
        margin: 30px auto;
        background-color: #5e001f;
        color: #fff;
        border: 1px solid #5e001f;
        border-radius: 4px;
        padding: 10px 20px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      #goBack:hover {
        background-color: #440017;
        box-shadow: 0 4px 10px rgba(68, 0, 23, 0.4);
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <img src="concordiaEmblem.png" alt="Concordia Emblem" />
      <h2>Concordia University — Block / Unblock Resources</h2>
    </header>

    <h1>Resources</h1>

    <div id="resourceContainer"></div>

    <button id="goBack" type="button">Go Back To Dashboard</button>

    <script>
      document.getElementById("goBack").addEventListener("click", function () {
        location.href = "adminPage.html";
      });

      const container = document.getElementById("resourceContainer");

      async function loadResources() {
        container.innerHTML = "";
        try {
          const res = await fetch("/api/admin/resources");
          const data = await res.json();
          if (!data.success || !data.resources.length) {
            container.innerHTML =
              "<p style='text-align:center'>No resources yet.</p>";
            return;
          }

          data.resources.forEach((r) => {
            const row = document.createElement("div");
            row.className = "resourceRow";

            const left = document.createElement("div");
            left.textContent = r.name + " ";

            const tag = document.createElement("span");
            tag.className = "tag " + (r.isBlocked ? "blocked" : "active");
            tag.textContent = r.isBlocked ? "Blocked" : "Active";
            left.appendChild(tag);

            const btn = document.createElement("button");
            btn.className = "statusBtn";
            btn.textContent = r.isBlocked ? "Unblock" : "Block";

            btn.onclick = async () => {
              try {
                const res = await fetch("/api/admin/toggle-block", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ room: r.name }), // ✅ FIXED
                });
                const data = await res.json();
                if (!data.success) {
                  alert(data.message || "Error toggling block status");
                  return;
                }
                loadResources();
              } catch (err) {
                console.error(err);
                alert("Network error.");
              }
            };

            row.appendChild(left);
            row.appendChild(btn);
            container.appendChild(row);
          });
        } catch (err) {
          console.error(err);
          container.innerHTML =
            "<p style='text-align:center'>Error loading resources.</p>";
        }
      }

      loadResources();
    </script>
  </body>
</html>
