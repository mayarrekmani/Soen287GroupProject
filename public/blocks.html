<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Block Resources</title>
    <link rel="stylesheet" href="projectStyle.css" />
    <style>
      body {
        background-color: #f5f5f5;
        color: #222;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 32px;
      }

      /* Header */
      .site-header {
        background-color: #5e001f;
        color: #fff;
        border-bottom: 4px solid #c9a646;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin: -32px -32px 24px -32px;
      }

      .site-header img {
        height: 48px;
      }

      h1 {
        color: #5e001f;
        font-size: 1.6rem;
        font-weight: 600;
        margin-bottom: 16px;
      }

      .card {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        max-width: 640px;
        padding: 16px 20px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.07);
        margin-bottom: 20px;
      }

      .blockItem {
        background: #fafafa;
        border: 1px solid #eee;
        border-radius: 6px;
        padding: 10px 12px;
        margin: 10px 0;
        font-size: 0.95rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      button {
        cursor: pointer;
        font-size: 0.9rem;
        border-radius: 4px;
        font-weight: 600;
        border: none;
        padding: 10px 16px;
        transition: all 0.15s ease;
      }

      .primaryButton {
        background-color: #5e001f;
        color: #fff;
        border: 1px solid #5e001f;
      }

      .primaryButton:hover {
        background-color: #440017;
        box-shadow: 0 4px 10px rgba(68, 0, 23, 0.4);
      }

      .secondaryButton {
        background-color: #fff;
        color: #5e001f;
        border: 1px solid #5e001f;
      }

      .secondaryButton:hover {
        background-color: #5e001f;
        color: #fff;
        box-shadow: 0 4px 10px rgba(94, 0, 31, 0.3);
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <header class="site-header">
      <img src="concordiaEmblem.png" alt="Concordia Emblem" />
      <h2>Concordia University — Block / Unblock Resources</h2>
    </header>

    <h1>Manage Resource Availability</h1>

    <div class="card">
      <p>
        Below is a list of all resources. You can permanently
        <strong>block</strong> or <strong>unblock</strong> a resource.
        <br /><br />
        A blocked resource will no longer appear in the student booking
        schedule.
      </p>
    </div>

    <div class="card">
      <h3>Resources</h3>
      <div id="resourceBlockList"></div>
    </div>

    <button id="goBack" class="primaryButton" type="button">
      Go Back To Dashboard
    </button>

    <script>
      // Go Back
      document.getElementById("goBack").onclick = () => {
        location.href = "adminPage.html";
      };

      // Load resources and block status
      async function loadResourceBlocks() {
        const container = document.getElementById("resourceBlockList");
        container.innerHTML = "";

        try {
          const res = await fetch("/api/admin/resources");
          const data = await res.json();

          if (!data.success || !data.resources.length) {
            container.innerHTML = "<p>No resources created yet.</p>";
            return;
          }

          data.resources.forEach((r) => {
            const div = document.createElement("div");
            div.className = "blockItem";

            const statusText = r.blocked ? "Blocked" : "Available";
            const buttonText = r.blocked ? "Unblock" : "Block";

            div.innerHTML = `
              <div>
                <strong>${r.name}</strong><br />
                <small>${r.location || ""}</small><br />
                <small>Capacity: ${r.capacity || "—"}</small><br />
                <small>Status: <b>${statusText}</b></small>
              </div>
              <div>
                <button
                  class="secondaryButton"
                  data-room="${r.name}"
                  data-blocked="${r.blocked ? "1" : "0"}"
                >
                  ${buttonText}
                </button>
              </div>
            `;

            container.appendChild(div);
          });

          // Attach event handlers
          document
            .querySelectorAll(".blockItem button.secondaryButton")
            .forEach((btn) => {
              btn.addEventListener("click", async () => {
                const room = btn.getAttribute("data-room");
                const isBlocked = btn.getAttribute("data-blocked") === "1";

                const url = isBlocked
                  ? "/api/admin/unblock-room"
                  : "/api/admin/block-room";

                try {
                  const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ room }),
                  });
                  const data = await res.json();

                  if (!data.success) {
                    alert(data.message || "Error updating block status.");
                    return;
                  }

                  loadResourceBlocks();
                } catch (err) {
                  console.error(err);
                  alert("Network error while updating block status.");
                }
              });
            });
        } catch (err) {
          console.error(err);
          container.innerHTML = "<p>Error loading resources.</p>";
        }
      }

      loadResourceBlocks();
    </script>
  </body>
</html>
