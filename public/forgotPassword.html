<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Change Password</title>
    <link rel="stylesheet" href="projectStyle.css" />
    <style>
  :root {
    --concordia-burgundy: #5e001f;
    --concordia-burgundy-dark: #440017;
    --concordia-gold: #c9a646;
    --bg-page: #f5f5f5;
    --text-main: #222;
    --card-bg: #fff;
    --card-border: #ddd;
  }

  body {
    background-color: var(--bg-page);
    font-family: system-ui, -apple-system, Arial;
    margin: 0;
    padding: 32px 16px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .site-header {
    background-color: var(--concordia-burgundy);
    color: #fff;
    border-bottom: 4px solid var(--concordia-gold);
    padding: 12px 24px;
    margin: -32px 0 32px 0;
    width: 100%;
    display: flex;
    align-items: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
  }

  .site-header img {
    height: 48px;
  }

  h1 {
    text-align: center;
    color: var(--concordia-burgundy);
    font-size: 1.5rem;
    margin-bottom: 28px;
  }

  /* FIXED SPACING HERE */
  label {
    display: block;
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 30px 30px; /* increased padding */
    width: 100%;
    max-width: 480px;
    margin-bottom: 26px;
    box-shadow: 0 18px 38px rgba(0, 0, 0, 0.07);
    font-weight: 600;
    font-size: 1rem;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 8px 8px; /* more padding inside box */
    margin-top: 14px; /* more space between label text + input */
    font-size: 1rem;
    border: 1px solid #bbb;
    border-radius: 8px;
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.04);
    transition: 0.2s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--concordia-burgundy);
    box-shadow: 0 0 0 3px rgba(94, 0, 31, 0.25);
  }

  .secondaryButton {
    margin-top: 16px;
    background-color: #fff;
    color: var(--concordia-burgundy);
    border: 2px solid var(--concordia-burgundy);
    border-radius: 8px;
    font-size: 1rem;
    padding: 12px 28px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 10px 22px rgba(94, 0, 31, 0.25);
    transition: 0.18s ease;
  }

  .secondaryButton:hover {
    background-color: var(--concordia-burgundy);
    color: #fff;
    box-shadow: 0 14px 26px rgba(94, 0, 31, 0.4);
  }
</style>

  </head>

  <body>
    <header class="site-header">
      <img src="concordiaEmblem.png" alt="Concordia Emblem" />
    </header>

    <h1>Reset Your Password</h1>

    <!-- EMAIL -->
    <label>
      Enter your email to reset password:
      <input type="text" id="gmail" placeholder="Enter email" />
    </label>

    <!-- NEW PASSWORD -->
    <label>
      New Password:
      <input type="password" id="newPass" placeholder="Enter new password" />
    </label>

    <!-- CONFIRM PASSWORD -->
    <label>
      Confirm New Password:
      <input
        type="password"
        id="confirmPass"
        placeholder="Re-enter new password"
      />
    </label>

    <!-- BUTTON -->
    <button id="submit" class="secondaryButton" type="button">
      Submit
    </button>

    <!-- SCRIPT -->
    <script>
      document.getElementById("submit").addEventListener("click", function () {
        const email = document.getElementById("gmail").value.trim();
        const newPass = document.getElementById("newPass").value.trim();
        const confirmPass = document
          .getElementById("confirmPass")
          .value.trim();

        // --- VALIDATION ---
        if (!email) {
          alert("Please enter your email.");
          return;
        }
        if (!newPass || !confirmPass) {
          alert("Please enter and confirm your new password.");
          return;
        }
        if (newPass !== confirmPass) {
          alert("New passwords do not match.");
          return;
        }

        // --- SEND TO BACKEND ---
        fetch("/api/reset-password-simple", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            email: email,
            newPassword: newPass,
          }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (!data.success) {
              alert(data.message || "Could not reset password.");
            } else {
              alert("Password has been reset successfully!");
              location.href = "index.html"; // back to login page
            }
          })
          .catch((err) => {
            console.error("Reset password error:", err);
            alert("Server error. Make sure node server.js is running.");
          });
      });
    </script>
  </body>
</html>
