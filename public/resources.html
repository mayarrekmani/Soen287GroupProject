<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Resources</title>
    <link rel="stylesheet" href="projectStyle.css" />
    <style>
      body {
        background-color: #f5f5f5;
        color: #222;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 32px;
        line-height: 1.4;
      }

      button {
        cursor: pointer;
        font-size: 0.9rem;
        line-height: 1.2;
        border-radius: 4px;
        font-weight: 600;
        border: none;
        padding: 10px 16px;
        margin-top: 6px;
        transition: all 0.15s ease;
      }

      .primaryButton {
        background-color: #5e001f;
        color: #fff;
        border: 1px solid #5e001f;
      }

      .site-header {
        background-color: #5e001f;
        color: #fff;
        border-bottom: 4px solid #c9a646;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin: -32px -32px 24px -32px;
      }
      .site-header img {
        height: 48px;
      }

      h1 {
        color: #5e001f;
        font-size: 1.6rem;
        font-weight: 600;
        margin-bottom: 16px;
      }

      form,
      .list {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px 20px;
        max-width: 640px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.07);
      }

      .row {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 10px;
        margin-bottom: 14px;
        font-size: 0.95rem;
      }

      .editBtn,
      .deleteBtn {
        background-color: #fff;
        color: #5e001f;
        border: 1px solid #5e001f;
        padding: 6px 12px;
        margin-right: 6px;
        border-radius: 4px;
        cursor: pointer;
      }
      .editBtn:hover {
        background-color: #e8e2e5;
      }
      .deleteBtn {
        border-color: #b30000;
        color: #b30000;
      }
      .deleteBtn:hover {
        background-color: #ffe6e6;
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <img src="concordiaEmblem.png" alt="Concordia Emblem" />
      <h2>Concordia University — Manage Resources</h2>
    </header>

    <h1>Resources</h1>

    <h2>Add / Edit Resource</h2>

    <form>
      <div class="row">
        <label>Name</label>
        <input id="resName" type="text" />
      </div>

      <div class="row">
        <label>Description</label>
        <textarea id="resDescription" rows="3"></textarea>
      </div>

      <div class="row">
        <label>Location</label>
        <input id="resLocation" type="text" />
      </div>

      <div class="row">
        <label>Capacity</label>
        <input id="resCapacity" type="number" min="1" />
      </div>

      <div class="actions">
        <button id="saveResource" class="secondaryButton" type="button">
          Save
        </button>
        <button id="clearResource" class="secondaryButton" type="button">
          Clear
        </button>
      </div>
    </form>

    <h2 style="margin-top: 18px">Existing Resources</h2>
    <div id="resourceList" class="list"></div>

    <button id="goBack" class="primaryButton" type="button">
      Go Back To Dashboard
    </button>

   <!--- <button id = "signOut" class = "primaryButton" type = "button">
      Sign Out
    </button>-->

    <script>
      document.getElementById("goBack").onclick = () => {
        location.href = "adminPage.html";
      };

      //document.getElementById("signOut").onclick = () => {
        //location.href = "login2.html";
      //};

      const nameInput = document.getElementById("resName");
      const descInput = document.getElementById("resDescription");
      const locInput = document.getElementById("resLocation");
      const capInput = document.getElementById("resCapacity");
      const listDiv = document.getElementById("resourceList");

      let editingName = null;

      document.getElementById("clearResource").onclick = () => {
        editingName = null;
        nameInput.value = "";
        descInput.value = "";
        locInput.value = "";
        capInput.value = "";
      };

      async function loadResources() {
        listDiv.innerHTML = "";

        const res = await fetch("/api/admin/resources");
        const data = await res.json();
        if (!data.success) return;

        data.resources.forEach((r) => {
          const card = document.createElement("div");
          card.className = "card";

          card.innerHTML = `
            <strong>${r.name}</strong> — Capacity ${r.capacity}<br/>
            <em>${r.location}</em><br/>
            <small>Description: ${r.description || "—"}</small><br/>
            <br/>
          `;

          const editBtn = document.createElement("button");
          editBtn.className = "editBtn";
          editBtn.textContent = "Edit";
          editBtn.onclick = () => {
            editingName = r.name;
            nameInput.value = r.name;
            descInput.value = r.description;
            locInput.value = r.location;
            capInput.value = r.capacity;
            window.scrollTo({ top: 0, behavior: "smooth" });
          };

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "deleteBtn";
          deleteBtn.textContent = "Delete";
          deleteBtn.onclick = async () => {
            if (!confirm("Delete this resource?")) return;

            const del = await fetch("/api/admin/resource/delete", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name: r.name }),
            });

            const out = await del.json();
            if (!out.success) {
              alert(out.message);
              return;
            }

            loadResources();
          };

          card.appendChild(editBtn);
          card.appendChild(deleteBtn);
          listDiv.appendChild(card);
        });
      }

      loadResources();

      document.getElementById("saveResource").onclick = async () => {
        const name = nameInput.value.trim();
        const description = descInput.value.trim();
        const location = locInput.value.trim();
        const capacity = capInput.value.trim();

        if (!name || !location || !capacity) {
          alert("Fill all required fields.");
          return;
        }

        if (editingName) {
          const res = await fetch("/api/admin/resource/update", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              oldName: editingName,
              name,
              description,
              location,
              capacity,
            }),
          });

          const out = await res.json();
          if (!out.success) {
            alert(out.message);
            return;
          }
        } else {
          const res = await fetch("/api/admin/resources", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name,
              description,
              location,
              capacity,
            }),
          });

          const out = await res.json();
          if (!out.success) {
            alert(out.message);
            return;
          }
        }

        editingName = null;
        nameInput.value = "";
        descInput.value = "";
        locInput.value = "";
        capInput.value = "";
        loadResources();
      };
    </script>
  </body>
</html>
