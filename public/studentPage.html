<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Student Home Page</title>
    <link rel="stylesheet" href="projectStyle.css" />
    <style>
      :root {
        --brand-dark: #5e001f;
        --brand-dark-hover: #440017;
        --brand-gold: #c9a646;
        --text-main: #222;
        --text-dim: #6b6b6b;
        --bg-page: #f5f5f5;
        --card-bg: #fff;
        --card-border: #ddd;
        --card-shadow: 0 24px 48px rgba(0, 0, 0, 0.06);
      }

      body {
        background-color: var(--bg-page);
        color: var(--text-main);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 30px;
      }

      .firstsection {
        width: calc(100% + 60px);
        margin: -30px 0 24px -30px;
        padding: 16px 24px;

        background-color: var(--brand-dark);
        color: #fff;
        border-bottom: 4px solid var(--brand-gold);

        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        row-gap: 12px;
        column-gap: 16px;

        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .firstsectionleft h1 {
        font-weight: 600;
        color: #fff;
        font-size: 1.1rem;
        line-height: 1.4;
        margin: 0 0 6px 0;
      }

      #displayName {
        color: #fff;
        font-weight: 600;
      }

      .dateBlock {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 4px;
      }
      .scheduleLabel {
        margin: 0;
        font-size: 0.8rem;
        color: #fff;
        line-height: 1.4;
        font-weight: 400;
      }

      .dateInput {
        background: #fff;
        border: 1px solid #999;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 0.8rem;
        line-height: 1.2;
        color: #222;
        min-width: 135px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      .bookButtonSpace .manageButton {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        text-decoration: none;
        line-height: 1.2;
        box-shadow: 0 16px 32px rgba(94, 0, 31, 0.4);
        transition: box-shadow 0.15s, transform 0.15s;
        white-space: nowrap;
      }
      .bookButtonSpace .manageButton:hover {
        background-color: var(--brand-dark-hover);
        border-color: var(--brand-dark-hover);
        box-shadow: 0 20px 36px rgba(68, 0, 23, 0.5);
      }

      .roomsection {
        margin-top: 20px;
      }

      .bookingfooter {
        margin-top: 12px;
        display: flex;
        justify-content: flex-end;
      }

      .bookButtonPrimary {
        cursor: pointer;
        font-size: 0.9rem;
        line-height: 1.2;
        border-radius: 4px;
        font-weight: 600;
        border: none;
        padding: 10px 16px;
        background-color: var(--brand-dark);
        color: #fff;
        border: 1px solid var(--brand-dark);
        transition: all 0.15s ease;
      }
      .bookButtonPrimary:hover {
        background-color: var(--brand-dark-hover);
        box-shadow: 0 4px 10px rgba(68, 0, 23, 0.4);
      }

      .infoText {
        font-size: 0.85rem;
        color: var(--text-dim);
        margin-top: 6px;
      }
    </style>
  </head>

  <body>
    <!-- Header / welcome -->
    <header class="firstsection">
      <!-- LEFT SIDE -->
      <div class="firstsectionleft">
        <h1>Welcome, <span id="displayName"></span>!</h1>
        <script>
          const username = localStorage.getItem("username");
          if (username) {
            document.getElementById("displayName").textContent = username;
          }
        </script>

        <div class="dateBlock">
          <label class="scheduleLabel"
            ><strong>Booking Schedule for:</strong></label
          >
          <input
            type="date"
            class="dateInput"
            id="dateInput"
            value="2025-10-19"
          />
        </div>
        <div class="infoText">
          Time slots and rooms below come from the admin's schedule for this
          date.
        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div class="bookButtonSpace">
        <a class="manageButton" href="managingAccountStudent.html">
          Manage My Account
        </a>
      </div>
    </header>

    <!-- STUDY ROOMS SECTION (dynamic table, style preserved) -->
    <section class="roomsection">
      <div class="sectionheader">
        <h2 class="tableTitle">Available Rooms</h2>
        <p class="description">
          Rooms and time slots shown are based on the schedule defined by the
          admin. Grey squares are unavailable; burgundy ones are available to
          book.
        </p>
      </div>

      <div class="booking">
        <table class="bookingtable" id="bookingTable">
          <thead>
            <tr id="bookingHeaderRow">
              <th class="roomNamecolumn">Room</th>
              <!-- Time headers will be injected here -->
            </tr>
          </thead>
          <tbody id="bookingBody">
            <!-- Rows injected here -->
          </tbody>
        </table>
        <div class="infoText" id="scheduleMessage"></div>
        <div class="bookingfooter">
          <button id="bookSelected" class="bookButtonPrimary" type="button">
            Book Selected Slots
          </button>
        </div>
      </div>
    </section>

    <script>
      const headerRow = document.getElementById("bookingHeaderRow");
      const body = document.getElementById("bookingBody");
      const dateInput = document.getElementById("dateInput");
      const scheduleMsg = document.getElementById("scheduleMessage");
      const currentUser = localStorage.getItem("username") || "student";

      let currentTimes = [];
      let currentRooms = [];

      async function fetchResources() {
        try {
          const res = await fetch("/api/admin/resources");
          const data = await res.json();
          if (!data.success) return [];
          // Only non-blocked rooms available to students
          return data.resources.filter((r) => !r.isBlocked).map((r) => r.name);
        } catch (err) {
          console.error(err);
          return [];
        }
      }

      async function fetchSchedule(date) {
        try {
          const res = await fetch(
            "/api/schedule?date=" + encodeURIComponent(date)
          );
          const data = await res.json();
          if (!data.success) return null;
          return data; // {rooms, times, schedule}
        } catch (err) {
          console.error(err);
          return null;
        }
      }

      function buildHeader(times) {
        // Clear old headers except first (Room)
        while (headerRow.children.length > 1) {
          headerRow.removeChild(headerRow.lastElementChild);
        }
        times.forEach((t) => {
          const th = document.createElement("th");
          th.textContent = t;
          headerRow.appendChild(th);
        });
      }

      function buildBody(activeRooms, times, scheduleObj) {
        body.innerHTML = "";
        if (!times.length || !activeRooms.length) {
          scheduleMsg.textContent =
            "No schedule has been defined by the admin for this date yet.";
          return;
        }
        scheduleMsg.textContent =
          "Select one or more available slots (burgundy squares) for a single room, then click 'Book Selected Slots'.";

        activeRooms.forEach((roomName) => {
          const tr = document.createElement("tr");

          const roomCell = document.createElement("td");
          roomCell.className = "roomName";
          roomCell.textContent = roomName;
          tr.appendChild(roomCell);

          const roomSlots = (scheduleObj[roomName] || []).reduce((acc, s) => {
            acc[s.time] = s.status;
            return acc;
          }, {});

          times.forEach((time) => {
            const td = document.createElement("td");
            const checkboxId = roomName.replace(/\s+/g, "_") + "_" + time;

            const input = document.createElement("input");
            input.type = "checkbox";
            input.className = "slotcheckbox";
            input.id = checkboxId;

            const label = document.createElement("label");
            label.htmlFor = checkboxId;

            const status = roomSlots[time] || "unavailable";
            if (status === "available") {
              label.className = "slotvisual slotvisual_available";
              input.disabled = false;
            } else {
              label.className = "slotvisual slotvisual_unavailable";
              input.disabled = true;
            }

            td.appendChild(input);
            td.appendChild(label);
            tr.appendChild(td);
          });

          body.appendChild(tr);
        });
      }

      async function refreshSchedule() {
        const date = dateInput.value;
        if (!date) return;

        const activeRooms = await fetchResources();
        const sched = await fetchSchedule(date);

        if (!sched || !sched.times.length) {
          currentTimes = [];
          currentRooms = [];
          buildHeader([]);
          buildBody([], [], {});
          return;
        }

        // Intersect schedule rooms with active rooms
        const roomsForDate = sched.rooms.filter((r) => activeRooms.includes(r));

        currentTimes = sched.times;
        currentRooms = roomsForDate;

        buildHeader(currentTimes);
        buildBody(roomsForDate, currentTimes, sched.schedule);
      }

      dateInput.addEventListener("change", refreshSchedule);

      document
        .getElementById("bookSelected")
        .addEventListener("click", async () => {
          if (!currentRooms.length || !currentTimes.length) {
            alert("No schedule available for this date.");
            return;
          }
          const date = dateInput.value;
          if (!date) {
            alert("Please select a date first.");
            return;
          }

          // Collect checked slots grouped by room
          const selectionsByRoom = {};
          currentRooms.forEach((room) => {
            selectionsByRoom[room] = [];
          });

          currentRooms.forEach((room) => {
            currentTimes.forEach((time) => {
              const id = room.replace(/\s+/g, "_") + "_" + time;
              const checkbox = document.getElementById(id);
              if (checkbox && checkbox.checked && !checkbox.disabled) {
                selectionsByRoom[room].push(time);
              }
            });
          });

          // Only allow multiple slots for a single room per booking request
          const roomsWithSelections = Object.entries(selectionsByRoom).filter(
            ([_, times]) => times.length > 0
          );

          if (!roomsWithSelections.length) {
            alert("Please select at least one available time slot.");
            return;
          }
          if (roomsWithSelections.length > 1) {
            alert(
              "Please select slots for only one room at a time (uncheck others)."
            );
            return;
          }

          const [room, slots] = roomsWithSelections[0];

          try {
            const res = await fetch("/api/bookings", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: currentUser,
                room,
                date,
                slots,
              }),
            });
            const data = await res.json();
            if (!data.success) {
              alert(data.message || "Error creating booking.");
              return;
            }
            alert("Booking request submitted!");
            // Reload schedule so newly booked slots become unavailable
            refreshSchedule();
          } catch (err) {
            console.error(err);
            alert("Network error while booking.");
          }
        });

      // Initial load
      refreshSchedule();
    </script>
  </body>
</html>
