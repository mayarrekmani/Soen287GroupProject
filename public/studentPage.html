<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Student Home Page</title>
    <link rel="stylesheet" href="projectStyle.css" />
    <style>
  :root {
    --brand-dark: #5e001f;
    --brand-dark-hover: #440017;
    --brand-gold: #c9a646;
    --text-main: #222;
    --text-dim: #6b6b6b;
    --bg-page: #f5f5f5;
    --card-bg: #fff;
    --card-border: #ddd;
    --card-shadow: 0 24px 48px rgba(0, 0, 0, 0.06);

    /* slot colors */
    --slot-green: #86c99c;
    --slot-green-border: #27ae60;
    --slot-green-hover: #b5e6c7;
    --slot-blue-hover: #cfe0ff;
    --slot-blue-selected: #2563eb;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 30px;
  }

  /* header */
  .firstsection {
    width: calc(100% + 60px);
    margin: -30px 0 24px -30px;
    padding: 16px 24px;
    background-color: var(--brand-dark);
    color: #fff;
    border-bottom: 4px solid var(--brand-gold);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    row-gap: 12px;
    column-gap: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  }

  .firstsectionleft h1 {
    font-weight: 600;
    color: #fff;
    font-size: 1.1rem;
    line-height: 1.4;
    margin: 0 0 6px 0;
  }

  #displayName {
    color: #fff;
    font-weight: 600;
  }

  .dateBlock {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 4px;
  }

  .scheduleLabel {
    margin: 0;
    font-size: 0.8rem;
    color: #fff;
    line-height: 1.4;
    font-weight: 600;
  }

  .dateInput {
    background: #fff;
    border: 1px solid #999;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 0.8rem;
    line-height: 1.2;
    color: #222;
    min-width: 135px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  }

  .manageButton {
    background-color: #fff;
    color: var(--brand-dark);
    border: 1px solid #fff;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    transition: all 0.15s ease;
  }

  .manageButton:hover {
    background-color: var(--brand-gold);
    color: #1e1e1e;
    box-shadow: 0 20px 36px rgba(0, 0, 0, 0.55);
  }

  .roomsection {
    max-width: 1200px;
    margin: 0 auto 32px auto;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: var(--card-shadow);
    padding: 24px 28px;
  }

  .sectionheader {
    margin-bottom: 20px;
  }

  .tableTitle {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-main);
  }

  .description {
    margin: 0;
    font-size: 0.9rem;
    color: var(--text-dim);
  }

  .booking {
    width: 100%;
    overflow-x: auto;
    border-radius: 14px;
    border: 1px solid rgba(0, 0, 0, 0.07);
    background: #ffffff;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
  }

  .bookingtable {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    min-width: 800px;
    font-size: 0.8rem;
  }

  .bookingtable thead th {
    background: radial-gradient(circle at 0% 0%, #ffffff 0%, #dbdada 100%);
    color: #2b2b2b;
    font-weight: 600;
    text-align: center;
    padding: 12px 10px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.07);
    font-size: 0.7rem;
    white-space: nowrap;
  }

  .bookingtable tbody td {
    position: relative;
    min-width: 80px;
    height: 56px;
    padding: 6px;
    background: #fff;
    border-top: 1px solid rgba(0, 0, 0, 0.07);
    text-align: center;
  }

  .roomName {
    background: radial-gradient(circle at 0% 0%, #faf9fa 0%, #ffffff 70%);
    color: #2b2b2b;
    font-size: 0.8rem;
    font-weight: 900;
    text-align: left;
    white-space: nowrap;
  }

 
  .slotcheckbox {
    position: absolute;
    inset: 5px;
    opacity: 0;
    cursor: pointer;
    z-index: 2;
  }

  .slotvisual {
    position: absolute;
    inset: 6px;
    border-radius: 8px;
    border: 2px solid transparent;
    display: block;
    transition: all 0.15s ease;
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    z-index: 1;
  }

  /* available:green */
  .slotvisual_available {
    background: var(--slot-green);
    border-color: var(--slot-green-border);
    box-shadow: 0 12px 24px rgba(98, 189, 136, 0.3);
  }

  /* hover: light blue*/
  .slotcheckbox:not(:disabled):hover + .slotvisual_available {
    background: var(--slot-blue-hover);
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35);
  }

  /* selected: dark blue */
  .slotcheckbox:checked + .slotvisual_available {
    background: var(--slot-blue-selected);
    border-color: #1d4ed8;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.6);
  }

  /* unavailable: dashed grey */
  .slotvisual_unavailable {
    background: repeating-linear-gradient(
      135deg,
      #bcbcbc 0px,
      #bcbcbc 6px,
      #9a9a9a 6px,
      #9a9a9a 12px
    );
    border: 2px solid #7a7a7a;
    opacity: 0.7;
    cursor: not-allowed;
  }

  .bookButtonPrimary {
    background-color: var(--brand-dark);
    color: #fff;
    border: 1px solid var(--brand-dark);
    border-radius: 6px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .bookButtonPrimary:hover {
    background-color: var(--brand-dark-hover);
  }

  /* Center the "Book Selected Slots" button */
.bookingfooter {
  display: flex;
  justify-content: center;
  margin-top: 24px;   /* pushes button downward from table */
  margin-bottom: 10px;
}

/* Make the button a little bigger + cleaner (optional, matches your style) */
.bookButtonPrimary {
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 0.9rem;
}

    </style>
  </head>

  <body>
    <!-- Header / welcome -->
    <header class="firstsection">
      <!-- LEFT SIDE -->
      <div class="firstsectionleft">
        <h1>Welcome, <span id="displayName"></span>!</h1>
        <script>
          const username = localStorage.getItem("username");
          if (username) {
            document.getElementById("displayName").textContent = username;
          }
        </script>

        <div class="dateBlock">
          <label class="scheduleLabel"
            ><strong>Booking Schedule for:</strong></label
          >
          <input
            type="date"
            class="dateInput"
            id="dateInput"
            value="2025-10-19"
          />
      

      <!-- RIGHT SIDE -->
      <div class="bookButtonSpace">
        <a class="manageButton" href="managingAccountStudent.html">
          Manage My Account
        </a>
      </div>
    </header>

    <!-- STUDY ROOMS SECTION -->
    <section class="roomsection">
      <div class="sectionheader">
        <h2 class="tableTitle">Available Rooms</h2>
        <p class="description">
      
      </div>

      <div class="booking">
        <table class="bookingtable" id="bookingTable">
          <thead>
            <tr id="bookingHeaderRow">
              <th class="roomNamecolumn">Room</th>
            </tr>
          </thead>
          <tbody id="bookingBody"></tbody>
        </table>
        <div class="infoText" id="scheduleMessage"></div>
        <div class="bookingfooter">
          <button id="bookSelected" class="bookButtonPrimary" type="button">
            Book Selected Slots
          </button>
        </div>
      </div>
    </section>

    <script>
      const headerRow = document.getElementById("bookingHeaderRow");
      const body = document.getElementById("bookingBody");
      const dateInput = document.getElementById("dateInput");
      const scheduleMsg = document.getElementById("scheduleMessage");
      const currentUser = localStorage.getItem("username") || "student";

      let currentTimes = [];
      let currentRooms = [];

      async function fetchResources() {
        try {
          const res = await fetch("/api/admin/resources");
          const data = await res.json();
          if (!data.success) return [];
          
          return data.resources.filter((r) => !r.isBlocked).map((r) => r.name);
        } catch (err) {
          console.error(err);
          return [];
        }
      }

      async function fetchSchedule(date) {
        try {
          const res = await fetch(
            "/api/schedule?date=" + encodeURIComponent(date)
          );
          const data = await res.json();
          if (!data.success) return null;
          return data; 
        } catch (err) {
          console.error(err);
          return null;
        }
      }

      function buildHeader(times) {
        while (headerRow.children.length > 1) {
          headerRow.removeChild(headerRow.lastElementChild);
        }
        times.forEach((t) => {
          const th = document.createElement("th");
          th.textContent = t;
          headerRow.appendChild(th);
        });
      }

      function buildBody(activeRooms, times, scheduleObj) {
        body.innerHTML = "";
        if (!times.length || !activeRooms.length) {
          scheduleMsg.textContent =
            "No schedule has been defined by the admin for this date yet.";
          return;
        }
        scheduleMsg.textContent =
          "Select one or more available slots for a single room, then click 'Book Selected Slots'.";

        activeRooms.forEach((roomName) => {
          const tr = document.createElement("tr");

          const roomCell = document.createElement("td");
          roomCell.className = "roomName";
          roomCell.textContent = roomName;
          tr.appendChild(roomCell);

          const roomSlots = (scheduleObj[roomName] || []).reduce((acc, s) => {
            acc[s.time] = s.status;
            return acc;
          }, {});

          times.forEach((time) => {
            const td = document.createElement("td");
            const checkboxId = roomName.replace(/\s+/g, "_") + "_" + time;

            const input = document.createElement("input");
            input.type = "checkbox";
            input.className = "slotcheckbox";
            input.id = checkboxId;

            const label = document.createElement("label");
            label.htmlFor = checkboxId;

            const status = roomSlots[time] || "unavailable";
            if (status === "available") {
              label.className = "slotvisual slotvisual_available";
              input.disabled = false;
            } else {
              label.className = "slotvisual slotvisual_unavailable";
              input.disabled = true;
            }

            td.appendChild(input);
            td.appendChild(label);
            tr.appendChild(td);
          });

          body.appendChild(tr);
        });
      }

      async function refreshSchedule() {
        const date = dateInput.value;
        if (!date) return;

        const activeRooms = await fetchResources();
        const sched = await fetchSchedule(date);

        if (!sched || !sched.times.length || !sched.rooms.length) {
          currentTimes = [];
          currentRooms = [];
          buildHeader([]);
          buildBody([], [], {});
          if (sched && sched.blackout) {
            scheduleMsg.textContent =
              "This date is marked as a blackout day. No bookings are available.";
          }
          return;
        }

        const roomsForDate = sched.rooms.filter((r) => activeRooms.includes(r));

        currentTimes = sched.times;
        currentRooms = roomsForDate;

        buildHeader(currentTimes);
        buildBody(roomsForDate, currentTimes, sched.schedule);
      }

      dateInput.addEventListener("change", refreshSchedule);

      document
        .getElementById("bookSelected")
        .addEventListener("click", async () => {
          if (!currentRooms.length || !currentTimes.length) {
            alert("No schedule available for this date.");
            return;
          }
          const date = dateInput.value;
          if (!date) {
            alert("Please select a date first.");
            return;
          }

          const selectionsByRoom = {};
          currentRooms.forEach((room) => {
            selectionsByRoom[room] = [];
          });

          currentRooms.forEach((room) => {
            currentTimes.forEach((time) => {
              const id = room.replace(/\s+/g, "_") + "_" + time;
              const checkbox = document.getElementById(id);
              if (checkbox && checkbox.checked && !checkbox.disabled) {
                selectionsByRoom[room].push(time);
              }
            });
          });

          const roomsWithSelections = Object.entries(selectionsByRoom).filter(
            ([_, times]) => times.length > 0
          );

          if (!roomsWithSelections.length) {
            alert("Please select at least one available time slot.");
            return;
          }
          if (roomsWithSelections.length > 1) {
            alert(
              "Please select slots for only one room at a time (uncheck others)."
            );
            return;
          }

          const [room, slots] = roomsWithSelections[0];

          try {
            const res = await fetch("/api/bookings", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: currentUser,
                room,
                date,
                slots,
              }),
            });
            const data = await res.json();
            if (!data.success) {
              alert(data.message || "Error creating booking.");
              return;
            }
            alert("Booking request submitted!");
            refreshSchedule();
          } catch (err) {
            console.error(err);
            alert("Network error while booking.");
          }
        });

      
      refreshSchedule();
    </script>
  </body>
</html>
