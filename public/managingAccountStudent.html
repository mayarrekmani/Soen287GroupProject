<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Account Management Page</title>
    <link rel="stylesheet" href="projectStyle.css" />
    <style>
      /* === Concordia Header === */
      .site-header {
        background-color: #5e001f; /* Burgundy */
        color: #fff;
        border-bottom: 4px solid #c9a646; /* Gold accent */
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        margin: -8px -8px 24px -8px;
      }

      .site-header img {
        height: 48px;
        width: auto;
      }

      body {
        background-color: #f5f5f5;
        color: #222;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 32px;
        line-height: 1.4;
      }

      h1 {
        color: #5e001f;
        font-size: 1.6rem;
        font-weight: 600;
        text-align: center;
        margin-bottom: 24px;
      }

      h2 {
        color: #333;
        font-size: 1.2rem;
        font-weight: 600;
        margin-top: 40px;
        text-align: center;
      }

      /* === Big menu buttons === */
      .largeButton {
        display: block;
        margin: 10px auto;
        background-color: #fff;
        color: #5e001f;
        border: 2px solid #5e001f;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        padding: 14px 28px;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 250px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }

      .largeButton:hover {
        background-color: #5e001f;
        color: #fff;
        box-shadow: 0 6px 12px rgba(94, 0, 31, 0.3);
      }

      /* === Appointment cards (dynamic) === */
      .appointmentCard {
        display: block;
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px 16px;
        margin: 12px auto;
        max-width: 700px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
        font-size: 0.95rem;
      }

      .appointmentMeta {
        display: inline-block;
        margin-right: 12px;
      }

      .appointmentActions {
        float: right;
      }

      /* Buttons inside appointment cards */
      .reschedule,
      .cancel {
        margin-left: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 4px;
        border: 1px solid #5e001f;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .reschedule {
        background-color: #fff;
        color: #5e001f;
      }

      .reschedule:hover {
        background-color: #5e001f;
        color: #fff;
        box-shadow: 0 3px 8px rgba(94, 0, 31, 0.3);
      }

      .cancel {
        background-color: #5e001f;
        color: #fff;
        border: 1px solid #5e001f;
      }

      .cancel:hover {
        background-color: #7a0b2b;
        box-shadow: 0 3px 8px rgba(94, 0, 31, 0.3);
      }

      /* Cancelled by admin style */
      .appointmentCard.cancelledAdmin {
        background-color: #f0f0f0;
        border-style: dashed;
        border-color: #b0b0b0;
        color: #777;
      }

      .appointmentCard.cancelledAdmin .appointmentActions {
        display: none; /* no reschedule/cancel buttons */
      }

      .emptyMessage {
        text-align: center;
        color: #666;
        font-size: 0.95rem;
        margin-top: 12px;
      }

       .goBackButton {
        display: block;
        background-color: #5e001f;
        color: #fff;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        padding: 12px 24px;
        font-size: 1rem;
        cursor: pointer;
        margin: 40px auto 0;
        box-shadow: 0 8px 20px rgba(94, 0, 31, 0.25);
        transition: all 0.2s ease;
      }

      .goBackButton:hover {
        background-color: #440017;
        box-shadow: 0 10px 24px rgba(94, 0, 31, 0.4);
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <img src="concordiaEmblem.png" alt="Concordia Emblem" />
      <h2>Concordia University — Account Management</h2>
    </header>

    <h1>
      Welcome, <span id="displayName"></span> please choose which option
      pertains to you.
    </h1>

    <button id="changePassword" class="largeButton" type="button">
      Reset Password
    </button>
    <button id="changeUsername" class="largeButton" type="button">
      Reset Username
    </button>
    <button id="specialRequest" class="largeButton" type="button">
      Special Booking Requests
    </button>
    <button id="pastAppointments" class="largeButton" type="button">
      Past Appointments
    </button>

    <h2>Upcoming Appointments:</h2>

    <div id="upcomingList"></div>

    <button id = "signOut" class = "goBackButton" type = "button">
      Sign Out
    </button>

    <script>
      const username = localStorage.getItem("username") || "student";
      document.getElementById("displayName").textContent = username;

      document
        .getElementById("changePassword")
        .addEventListener("click", function () {
          location.href = "forgotPassword.html";
        });
      document
        .getElementById("changeUsername")
        .addEventListener("click", function () {
          location.href = "changeUsername.html";
        });
      document
        .getElementById("specialRequest")
        .addEventListener("click", function () {
          location.href = "specialRequest.html";
        });
      document
        .getElementById("pastAppointments")
        .addEventListener("click", function () {
          location.href = "pastAppointments.html";
        });

      document
        .getElementById("signOut")
        .addEventListener("click", function(){
          location.href = "index.html";
        });

      const upcomingListDiv = document.getElementById("upcomingList");

      function todayString() {
        return new Date().toISOString().slice(0, 10); // YYYY-MM-DD
      }

      function formatTime(t) {
        // t is "13:00" -> "1:00 pm"
        const [hStr, mStr] = t.split(":");
        let h = parseInt(hStr, 10);
        const ampm = h >= 12 ? "pm" : "am";
        if (h === 0) h = 12;
        else if (h > 12) h -= 12;
        return `${h}:${mStr} ${ampm}`;
      }

      function formatBookingText(b) {
        const start = formatTime(b.startTime);
        const end = formatTime(b.endTime);
        return `Time = ${start} - ${end} ${b.date} Room = ${b.room}`;
      }

      async function loadUpcoming() {
        upcomingListDiv.innerHTML = "";

        try {
          const res = await fetch(
            "/api/my-bookings?username=" + encodeURIComponent(username)
          );
          const data = await res.json();
          if (!data.success) {
            upcomingListDiv.innerHTML =
              "<p class='emptyMessage'>Could not load bookings.</p>";
            return;
          }

          const today = todayString();
          const upcoming = data.bookings
            .filter((b) => b.date >= today)
            .sort((a, b) => {
              // sort by date then startTime
              if (a.date !== b.date) return a.date.localeCompare(b.date);
              return a.startTime.localeCompare(b.startTime);
            });

          if (!upcoming.length) {
            upcomingListDiv.innerHTML =
              "<p class='emptyMessage'>You currently have no upcoming appointments.</p>";
            return;
          }

          upcoming.forEach((b) => {
            const card = document.createElement("div");
            card.className = "appointmentCard";

            const metaSpan = document.createElement("span");
            metaSpan.className = "appointmentMeta";
            metaSpan.textContent = formatBookingText(b);

            const actionsDiv = document.createElement("span");
            actionsDiv.className = "appointmentActions";

            // Cancelled because room removed
            if (b.status === "cancelled_by_admin") {
              card.classList.add("cancelledAdmin");
              const note = document.createElement("div");
              note.style.marginTop = "4px";
              note.style.fontSize = "0.85rem";
              note.textContent =
                b.cancelReason ||
                "This booking was cancelled because the resource was removed.";
              card.appendChild(metaSpan);
              card.appendChild(note);
              upcomingListDiv.appendChild(card);
              return;
            }

            // Normal / pending / approved bookings → show buttons
            const resBtn = document.createElement("button");
            resBtn.type = "button";
            resBtn.className = "reschedule";
            resBtn.textContent = "Reschedule";
            resBtn.onclick = async () => {
              // For now just go back to booking page
              //location.href = "studentPage.html";
              if(!confirm("Would you like to reschedule your booking? Your original booking will be cancelled.")){
                return;
              }

              try{
                const res = await fetch(`/api/bookings/${b.id}/cancel`,{
                  method:"POST"
                });

                const data = await res.json();

                if(!data.success){
                  alert(data.message || "Error cancelling booking.");
                  return;
                }

                alert("Your booking has been cancelled. Please select a new time from those available.");

                location.href = "studentPage.html"
              }

              catch(err){
                console.error(err);
                alert("Network error while cancelling booking.");
              }

            };

            const cancelBtn = document.createElement("button");
            cancelBtn.type = "button";
            cancelBtn.className = "cancel";
            cancelBtn.textContent = "Cancel";
            cancelBtn.onclick = async () => {
              if (!confirm("Cancel this appointment?")) return;
              try {
                const res = await fetch("/api/bookings/" + b.id + "/cancel", {
                  method: "POST",
                });
                const d = await res.json();
                if (!d.success) {
                  alert(d.message || "Error cancelling booking.");
                  return;
                }
                loadUpcoming();
              } catch (err) {
                console.error(err);
                alert("Network error while cancelling.");
              }
            };

            actionsDiv.appendChild(resBtn);
            actionsDiv.appendChild(cancelBtn);

            card.appendChild(metaSpan);
            card.appendChild(actionsDiv);
            upcomingListDiv.appendChild(card);
          });
        } catch (err) {
          console.error(err);
          upcomingListDiv.innerHTML =
            "<p class='emptyMessage'>Network error while loading bookings.</p>";
        }
      }

      loadUpcoming();
    </script>
  </body>
</html>
