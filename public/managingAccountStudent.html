<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Account Management Page</title>
    <link rel="stylesheet" href="projectStyle.css" />
    <style>
      :root {
        --brand-dark: #5e001f;
        --brand-dark-hover: #440017;
        --brand-gold: #c9a646;
        --text-main: #222;
        --text-dim: #6b6b6b;
        --bg-page: #f5f5f5;
        --card-bg: #fff;
        --card-border: #ddd;
      }

      body {
        background-color: var(--bg-page);
        color: var(--text-main);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 0;
        line-height: 1.4;
      }

      /* === Header === */
      .site-header {
        background-color: var(--brand-dark);
        color: #fff;
        border-bottom: 4px solid var(--brand-gold);
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
      }

      .site-header img {
        height: 48px;
        width: auto;
      }

      .site-header h2 {
        font-size: 1.1rem;
        font-weight: 600;
      }

      /* === Layout === */
      .layout {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: calc(100vh - 72px);
        background-color: var(--bg-page);
      }

      /* === Sidebar === */
      .sidebar {
        background-color: #faf7f8;
        border-right: 1px solid #e0d5d8;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .sidebar-title {
        font-size: 0.95rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7a4a57;
        margin-bottom: 6px;
      }

      .sidebar-link {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        border-radius: 999px;
        border: 1px solid transparent;
        padding: 8px 12px;
        font-size: 0.9rem;
        font-weight: 500;
        color: #5b3a44;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .sidebar-link:hover {
        background-color: #f1e4e8;
        border-color: #e0c3cf;
      }

      .sidebar-link.active {
        background-color: var(--brand-dark);
        color: #fff;
        border-color: var(--brand-dark);
        box-shadow: 0 4px 12px rgba(94, 0, 31, 0.3);
      }

      .sidebar-link-danger {
        margin-top: 16px;
        color: #fff;
        background-color: var(--brand-dark);
        border-color: var(--brand-dark);
        font-weight: 600;
      }

      .sidebar-link-danger:hover {
        background-color: var(--brand-dark-hover);
        border-color: var(--brand-dark-hover);
      }

      /* === Main content === */
      .content {
        padding: 24px 28px 32px 28px;
      }

      h1 {
        color: var(--brand-dark);
        font-size: 1.6rem;
        font-weight: 600;
        margin: 0 0 8px 0;
      }

      .content-subtitle {
        margin: 0 0 18px 0;
        font-size: 0.9rem;
        color: var(--text-dim);
      }

      /* === Cards & tables === */
      .cards-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
        align-items: flex-start;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .cards-grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--card-bg);
        border-radius: 12px;
        border: 1px solid var(--card-border);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        padding: 16px 18px 14px 18px;
      }

      .card h2 {
        font-size: 1.05rem;
        margin: 0 0 8px 0;
        color: #333;
      }

      .table-wrapper {
        max-height: 260px;
        overflow: auto;
        border-radius: 8px;
        border: 1px solid #e5e5e5;
        background: #fff;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      thead {
        background: #f3f3f3;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      th,
      td {
        padding: 8px 10px;
        border-bottom: 1px solid #eee;
        text-align: left;
        white-space: nowrap;
      }

      th {
        font-weight: 600;
        font-size: 0.8rem;
        color: #444;
      }

      tbody tr:nth-child(even) {
        background-color: #fafafa;
      }

      .empty-row td {
        text-align: center;
        color: var(--text-dim);
        font-style: italic;
      }

      /* ACTION BUTTONS */
      .action-btn {
        border: 1px solid var(--brand-dark);
        background: #fff;
        color: var(--brand-dark);
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        margin-right: 4px;
        transition: all 0.15s ease;
      }
      .action-btn:hover {
        background-color: var(--brand-dark);
        color: #fff;
        box-shadow: 0 3px 8px rgba(94, 0, 31, 0.25);
      }
      .action-btn-danger {
        background: var(--brand-dark);
        color: white;
      }
      .action-btn-danger:hover {
        background-color: var(--brand-dark-hover);
      }

      /* HIDDEN SECTIONS */
      .hidden {
        display: none;
      }

      .section-below {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ===== FORM CARDS (CHANGE USERNAME, SPECIAL REQUESTS) ===== */
      .formCard {
        max-width: 450px;
        background: white;
        padding: 22px;
        border-radius: 12px;
        border: 1px solid #ddd;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.07);
        margin-top: 10px;
      }
      .formCard h2 {
        margin-top: 0;
        margin-bottom: 12px;
        color: var(--brand-dark);
      }
      .formCard label {
        font-weight: 600;
        margin-top: 14px;
        display: block;
      }
      .formCard input,
      .formCard textarea {
        width: 100%;
        margin-top: 6px;
        padding: 4px;
        border: 1px solid #bbb;
        border-radius: 6px;
        font-size: 0.9rem;
      }
      .primaryBtn {
        background: var(--brand-dark);
        color: white;
        padding: 10px 14px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        margin-top: 16px;
        font-weight: 600;
        width: 100%;
        transition: 0.15s;
      }
      .primaryBtn:hover {
        background: var(--brand-dark-hover);
        box-shadow: 0 4px 10px rgba(68, 0, 23, 0.4);
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <img src="concordiaEmblem.png" />
      <h2>Concordia University — Account Management</h2>
    </header>

    <div class="layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <button class="sidebar-link active" data-nav="overview">
          Bookings Overview & Requests
        </button>
        <!-- Reset Password REMOVED -->
        <button class="sidebar-link" data-nav="changeUser">
          Change Username
        </button>
        <button class="sidebar-link" data-nav="specialReq">
          Special Booking Requests
        </button>
        <button class="sidebar-link" id="goBookings">
          Go to Bookings Page
        </button>
        <button class="sidebar-link sidebar-link-danger" id="signOut">
          Sign Out
        </button>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="content">
        <h1>Welcome, <span id="displayName"></span></h1>

        <!-- ===================== OVERVIEW SECTION ===================== -->
        <div id="section-overview">
          <div class="cards-grid">
            <!-- UPCOMING -->
            <section class="card">
              <h2>Upcoming Appointments</h2>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Time</th>
                      <th>Room</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="upcomingBody"></tbody>
                </table>
              </div>
            </section>

            <!-- PAST -->
            <section class="card">
              <h2>Past Appointments</h2>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Time</th>
                      <th>Room</th>
                    </tr>
                  </thead>
                  <tbody id="pastBody"></tbody>
                </table>
              </div>
            </section>
          </div>

          <div class="section-below">
            <!-- SPECIAL REQUESTS TABLE -->
            <section class="card hidden" id="specialRequestsSection">
              <h2>Special Requests</h2>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>Room</th>
                      <th>Date</th>
                      <th>Requested Time</th>
                      <th>Details</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="specialRequestsBody"></tbody>
                </table>
              </div>
            </section>

            <!-- CANCELLED BOOKINGS -->
            <section class="card hidden" id="cancelledSection">
              <h2>Cancelled Bookings</h2>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Time</th>
                      <th>Room</th>
                      <th>Reason</th>
                    </tr>
                  </thead>
                  <tbody id="cancelledBody"></tbody>
                </table>
              </div>
            </section>
          </div>
        </div>

        <!-- ===================== CHANGE USERNAME SECTION ===================== -->
        <div id="section-changeUser" class="hidden">
          <div class="formCard">
            <h2>Change Username</h2>

            <label>New Username:</label>
            <input type="text" id="newUsername" />

            <button class="primaryBtn" id="changeUserSubmit">Submit</button>
          </div>
        </div>

        <!-- ===================== SPECIAL REQUEST FORM ===================== -->
        <div id="section-specialReq" class="hidden">
          <div class="formCard">
            <h2>Special Booking Request</h2>

            <label>Room you want:</label>
            <input id="srRoom" placeholder="Enter room" />

            <label>Date requested:</label>
            <input type="date" id="srDate" />

            <label>Explain your request:</label>
            <textarea id="srMsg" rows="4"></textarea>

            <label>Hours requested:</label>
            <input id="srHours" placeholder="ex. 10:00 - 11:00" />

            <button class="primaryBtn" id="srSubmit">Submit Request</button>
          </div>
        </div>
      </main>
    </div>

    <script>
      // IMPORTANT: use the SAME key as studentPage
      let username = localStorage.getItem("studentUsername") || "student";
      document.getElementById("displayName").textContent = username;

      /* ---------- SIDEBAR NAVIGATION ---------- */
      document.querySelectorAll(".sidebar-link[data-nav]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".sidebar-link[data-nav]")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");

          const target = btn.getAttribute("data-nav");

          document.getElementById("section-overview").classList.add("hidden");
          document.getElementById("section-changeUser").classList.add("hidden");
          document.getElementById("section-specialReq").classList.add("hidden");

          if (target === "overview")
            document
              .getElementById("section-overview")
              .classList.remove("hidden");
          if (target === "changeUser")
            document
              .getElementById("section-changeUser")
              .classList.remove("hidden");
          if (target === "specialReq")
            document
              .getElementById("section-specialReq")
              .classList.remove("hidden");

          // reload data every time you switch tabs so it's always fresh
          loadAllData();
        });
      });

      // Go to bookings page (studentPage)
      document.getElementById("goBookings").onclick = () => {
        location.href = "studentPage.html";
      };

      /* ---------- CHANGE USERNAME FORM ---------- */
      document.getElementById("changeUserSubmit").onclick = async () => {
        const nu = document.getElementById("newUsername").value.trim();
        if (!nu) return alert("Enter a new username");

        const oldUsername = username;

        const res = await fetch("/api/change-username", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ oldUsername, newUsername: nu }),
        });
        const data = await res.json();
        if (!data.success) return alert(data.message || "Error updating.");

        alert("Username updated!");
        document.getElementById("newUsername").value = "";

        // update local and UI
        username = nu;
        localStorage.setItem("studentUsername", nu);
        // if you ever stored 'username' elsewhere, keep it in sync too:
        localStorage.setItem("username", nu);
        document.getElementById("displayName").textContent = nu;

        // reload bookings / requests under new name
        loadAllData();
      };

      /* ---------- SPECIAL REQUEST FORM ---------- */
      document.getElementById("srSubmit").onclick = async () => {
        const room = document.getElementById("srRoom").value.trim();
        const date = document.getElementById("srDate").value.trim();
        const msg = document.getElementById("srMsg").value.trim();
        const hrs = document.getElementById("srHours").value.trim();

        const res = await fetch("/api/special-request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            student: username,
            room,
            date,
            message: msg,
            hours: hrs,
          }),
        });

        const data = await res.json();
        if (!data.success) return alert(data.message || "Error sending.");

        alert("Request sent!");

        // CLEAR FORM INPUTS AFTER SUBMIT
        document.getElementById("srRoom").value = "";
        document.getElementById("srDate").value = "";
        document.getElementById("srMsg").value = "";
        document.getElementById("srHours").value = "";

        // reload data so the new request shows in Special Requests table
        loadAllData();
      };

      /* ---------- SIGN OUT ---------- */
      document.getElementById("signOut").onclick = () => {
        location.href = "index.html";
      };

      /* ---------- LOAD BOOKINGS / REQUESTS ---------- */

      function todayString() {
        return new Date().toISOString().slice(0, 10);
      }

      function formatTime(t) {
        const [h, m] = t.split(":");
        let hh = parseInt(h, 10);
        const ampm = hh >= 12 ? "pm" : "am";
        if (hh === 0) hh = 12;
        else if (hh > 12) hh -= 12;
        return `${hh}:${m} ${ampm}`;
      }
      function timeRange(b) {
        return `${formatTime(b.startTime)} – ${formatTime(b.endTime)}`;
      }

      function loadAllData() {
        // BOOKINGS for upcoming/past/cancelled
        fetch("/api/my-bookings?username=" + encodeURIComponent(username))
          .then((res) => res.json())
          .then((data) => {
            const today = todayString();
            const bookings = data.bookings || [];

            const upcoming = [];
            const past = [];
            const cancelled = [];

            bookings.forEach((b) => {
              if (b.status?.startsWith("cancelled") || b.status === "denied") {
                cancelled.push(b);
              } else if (b.date >= today) {
                upcoming.push(b);
              } else {
                past.push(b);
              }
            });

            renderUpcoming(upcoming);
            renderPast(past);
            renderCancelled(cancelled);
          });

        // SPECIAL REQUESTS for this student (any status)
        fetch(
          "/api/special-request/for-student?student=" +
            encodeURIComponent(username)
        )
          .then((res) => res.json())
          .then((data) => {
            const arr = data.requests || [];
            renderSpecialRequests(arr);
          });
      }

      function renderUpcoming(arr) {
        const tbody = document.getElementById("upcomingBody");
        tbody.innerHTML = "";
        if (!arr.length) {
          tbody.innerHTML = `<tr class="empty-row"><td colspan="4">You currently have no upcoming appointments.</td></tr>`;
          return;
        }
        arr.forEach((b) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
      <td>${b.date}</td>
      <td>${timeRange(b)}</td>
      <td>${b.room}</td>
      <td>
        <button class="action-btn" onclick="reschedule(${
          b.id
        })">Reschedule</button>
        <button class="action-btn action-btn-danger" onclick="cancelBooking(${
          b.id
        })">Cancel</button>
      </td>`;
          tbody.appendChild(tr);
        });
      }

      async function reschedule(id) {
        if (
          !confirm(
            "Would you like to reschedule your booking? Your original booking will be cancelled."
          )
        )
          return;
        await fetch(`/api/bookings/${id}/cancel`, { method: "POST" });
        alert("Your booking has been cancelled. Please select a new time.");
        location.href = "studentPage.html";
      }
      async function cancelBooking(id) {
        if (!confirm("Cancel this appointment?")) return;
        await fetch(`/api/bookings/${id}/cancel`, { method: "POST" });
        loadAllData();
      }

      function renderPast(arr) {
        const tbody = document.getElementById("pastBody");
        tbody.innerHTML = "";
        if (!arr.length) {
          tbody.innerHTML = `<tr class="empty-row"><td colspan="3">You have no past appointments yet.</td></tr>`;
          return;
        }
        arr.forEach((b) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${b.date}</td><td>${timeRange(b)}</td><td>${
            b.room
          }</td>`;
          tbody.appendChild(tr);
        });
      }

      function renderCancelled(arr) {
        const sec = document.getElementById("cancelledSection");
        const tbody = document.getElementById("cancelledBody");
        tbody.innerHTML = "";
        if (!arr.length) {
          sec.classList.add("hidden");
          return;
        }
        sec.classList.remove("hidden");

        arr.forEach((b) => {
          const reason =
            b.cancelReason ||
            "Time slot is no longer available for administrative reasons.";
          const tr = document.createElement("tr");
          tr.innerHTML = `
      <td>${b.date}</td>
      <td>${timeRange(b)}</td>
      <td>${b.room}</td>
      <td>${reason}</td>`;
          tbody.appendChild(tr);
        });
      }

      function renderSpecialRequests(arr) {
        const sec = document.getElementById("specialRequestsSection");
        const tbody = document.getElementById("specialRequestsBody");
        tbody.innerHTML = "";
        if (!arr.length) {
          sec.classList.add("hidden");
          return;
        }
        sec.classList.remove("hidden");

        arr.forEach((r) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
      <td>${r.room || "-"}</td>
      <td>${r.date || "-"}</td>
      <td>${r.hours || "-"}</td>
      <td>${r.message || "-"}</td>
      <td>${r.status || "pending"}</td>`;
          tbody.appendChild(tr);
        });
      }

      // expose for inline onclick
      window.reschedule = reschedule;
      window.cancelBooking = cancelBooking;

      // initial load
      loadAllData();
    </script>
  </body>
</html>
