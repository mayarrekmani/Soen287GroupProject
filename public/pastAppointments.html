<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Past Appointments</title>
    <link rel="stylesheet" href="projectStyle.css" />
    <style>
      /* === Concordia Header === */
      .site-header {
        background-color: #5e001f;
        color: #fff;
        border-bottom: 4px solid #c9a646;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        margin: -8px -8px 24px -8px;
      }

      .site-header img {
        height: 48px;
        width: auto;
      }

      body {
        background-color: #f5f5f5;
        color: #222;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 32px;
        line-height: 1.4;
      }

      h1 {
        color: #5e001f;
        font-size: 1.6rem;
        font-weight: 600;
        text-align: center;
        margin-bottom: 24px;
      }

      .backButton {
        display: block;
        margin: 0 auto 24px auto;
        background-color: #fff;
        color: #5e001f;
        border: 2px solid #5e001f;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        padding: 10px 22px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }

      .backButton:hover {
        background-color: #5e001f;
        color: #fff;
        box-shadow: 0 6px 12px rgba(94, 0, 31, 0.3);
      }

      .appointmentCard {
        display: block;
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px 16px;
        margin: 12px auto;
        max-width: 700px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
        font-size: 0.95rem;
      }

      .appointmentHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }

      .appointmentMeta {
        font-weight: 500;
      }

      .statusTag {
        font-size: 0.8rem;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid #bbb;
      }

      .status-approved {
        background-color: #e6ffe9;
        border-color: #1e7b3a;
        color: #1e7b3a;
      }

      .status-pending {
        background-color: #fff7e6;
        border-color: #c9971e;
        color: #c9971e;
      }

      .status-denied,
      .status-cancelled_by_student,
      .status-cancelled_by_admin {
        background-color: #ffe6e6;
        border-color: #b30000;
        color: #b30000;
      }

      .cancelReason {
        font-size: 0.85rem;
        color: #666;
        margin-top: 4px;
      }

      .emptyMessage {
        text-align: center;
        color: #666;
        font-size: 0.95rem;
        margin-top: 12px;
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <img src="concordiaEmblem.png" alt="Concordia Emblem" />
      <h2>Concordia University — Past Appointments</h2>
    </header>

    <h1>Past Appointments for <span id="displayName"></span></h1>

    <button id="backBtn" class="backButton" type="button">
      Back to Account Management
    </button>

    <div id="pastList"></div>

    <script>
      const username = localStorage.getItem("username") || "student";
      document.getElementById("displayName").textContent = username;

      document.getElementById("backBtn").onclick = () => {
        location.href = "managingAccountStudent.html";
      };

      const pastListDiv = document.getElementById("pastList");

      function todayString() {
        return new Date().toISOString().slice(0, 10); // YYYY-MM-DD
      }

      function formatTime(t) {
        const [hStr, mStr] = t.split(":");
        let h = parseInt(hStr, 10);
        const ampm = h >= 12 ? "pm" : "am";
        if (h === 0) h = 12;
        else if (h > 12) h -= 12;
        return `${h}:${mStr} ${ampm}`;
      }

      function formatBookingText(b) {
        const start = formatTime(b.startTime);
        const end = formatTime(b.endTime);
        return `Time = ${start} - ${end} · ${b.date} · Room = ${b.room}`;
      }
      async function loadPast() {
        pastListDiv.innerHTML = "";

        try {
          const res = await fetch(
            "/api/my-bookings?username=" + encodeURIComponent(username)
          );
          const data = await res.json();
          if (!data.success) {
            pastListDiv.innerHTML =
              "<p class='emptyMessage'>Could not load bookings.</p>";
            return;
          }

          const today = todayString();
          const past = data.bookings
            .filter((b) => b.date < today)
            .sort((a, b) => {
              if (a.date !== b.date) return b.date.localeCompare(a.date); // newest first
              return b.startTime.localeCompare(a.startTime);
            });

          if (!past.length) {
            pastListDiv.innerHTML =
              "<p class='emptyMessage'>You have no past appointments yet.</p>";
            return;
          }

          past.forEach((b) => {
            const card = document.createElement("div");
            card.className = "appointmentCard";

            const header = document.createElement("div");
            header.className = "appointmentHeader";

            const meta = document.createElement("div");
            meta.className = "appointmentMeta";
            meta.textContent = formatBookingText(b);

            header.appendChild(meta);
            card.appendChild(header);

            if (b.cancelReason) {
              const reasonDiv = document.createElement("div");
              reasonDiv.className = "cancelReason";
              reasonDiv.textContent = b.cancelReason;
              card.appendChild(reasonDiv);
            }

            pastListDiv.appendChild(card);
          });
        } catch (err) {
          console.error(err);
          pastListDiv.innerHTML =
            "<p class='emptyMessage'>Network error while loading past appointments.</p>";
        }
      }

      loadPast();
    </script>
  </body>
</html>
