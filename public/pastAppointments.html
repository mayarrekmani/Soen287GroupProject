<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Past Appointments</title>
    <link rel="stylesheet" href="projectStyle.css" />
    <style>
      .site-header {
        background-color: #5e001f;
        color: #fff;
        border-bottom: 4px solid #c9a646;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        margin: -8px -8px 24px -8px;
      }
      button {
        cursor: pointer;
        font-size: 0.9rem;
        line-height: 1.2;
        border-radius: 4px;
        font-weight: 600;
        border: none;
        padding: 10px 16px;
        margin-top: 8px;
        transition: all 0.15s ease;
      }

      .primaryButton {
        background-color: #5e001f;
        color: #fff;
        border: 1px solid #5e001f;
      }

      .primaryButton:hover {
        background-color: #440017;
        box-shadow: 0 4px 10px rgba(68, 0, 23, 0.4);
      }

      .site-header img {
        height: 48px;
        width: auto;
      }

      body {
        background-color: #f5f5f5;
        color: #222;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 32px;
        line-height: 1.4;
      }

      h1 {
        color: #5e001f;
        font-size: 1.6rem;
        font-weight: 600;
        text-align: center;
        margin-bottom: 24px;
      }

      .redBlock {
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px 20px;
        max-width: 700px;
        margin: 12px auto;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
        font-size: 1rem;
        color: #333;
        text-align: center;
      }

      .redBlock:hover {
        border-color: #5e001f;
        box-shadow: 0 6px 14px rgba(94, 0, 31, 0.15);
      }

      .statusTag {
        display: inline-block;
        margin-left: 8px;
        font-size: 0.8rem;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid #bbb;
      }
      .statusTag.pending {
        background: #fff9e6;
        border-color: #e6b800;
        color: #a67c00;
      }
      .statusTag.approved {
        background: #e6ffe9;
        border-color: #1e7b3a;
        color: #1e7b3a;
      }
      .statusTag.denied {
        background: #ffe6e6;
        border-color: #cc0000;
        color: #cc0000;
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <img src="concordiaEmblem.png" alt="Concordia Emblem" />
      <h2>Concordia University — Past Appointments</h2>
    </header>

    <h1>Your past appointments:</h1>

    <div id="appointmentsContainer"></div>

    <button id="goBack" class="primaryButton" type="button">
      Go Back To Dashboard
    </button>

    <script>
      document.getElementById("goBack").addEventListener("click", function () {
        location.href = "studentPage.html";
      });

      async function loadAppointments() {
        const container = document.getElementById("appointmentsContainer");
        container.innerHTML = "";

        const username = localStorage.getItem("username");
        if (!username) {
          container.innerHTML =
            "<p style='text-align:center'>No user logged in.</p>";
          return;
        }

        try {
          const res = await fetch(
            "/api/my-bookings?username=" + encodeURIComponent(username)
          );
          const data = await res.json();
          if (!data.success) {
            container.innerHTML =
              "<p style='text-align:center'>Could not load appointments.</p>";
            return;
          }

          const today = new Date().toISOString().split("T")[0];

          const past = data.bookings.filter((b) => b.date < today);
          if (!past.length) {
            container.innerHTML =
              "<p style='text-align:center'>You have no past appointments yet.</p>";
            return;
          }

          past.sort((a, b) => {
            if (a.date === b.date) {
              return a.startTime.localeCompare(b.startTime);
            }
            return b.date.localeCompare(a.date); // newest first
          });

          past.forEach((b) => {
            const div = document.createElement("div");
            div.className = "redBlock";

            const status = (b.status || "pending").toLowerCase();
            let statusClass = "pending";
            if (status === "approved") statusClass = "approved";
            else if (status === "denied") statusClass = "denied";

            div.innerHTML = `
              ${b.startTime} - ${b.endTime} ${b.date} — Room: ${b.room}
              <span class="statusTag ${statusClass}">${status}</span>
            `;
            container.appendChild(div);
          });
        } catch (err) {
          console.error(err);
          container.innerHTML =
            "<p style='text-align:center'>Error loading appointments.</p>";
        }
      }

      loadAppointments();
    </script>
  </body>
</html>
