<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Approve / Reject Bookings</title>
    <link rel="stylesheet" href="projectStyle.css" />
    <style>
      body {
        background-color: #f5f5f5;
        color: #222;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 32px;
      }

      .site-header {
        background-color: #5e001f;
        color: #fff;
        border-bottom: 4px solid #c9a646;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin: -32px -32px 24px -32px;
      }
      .site-header img {
        height: 48px;
      }

      h1 {
        color: #5e001f;
        font-size: 1.6rem;
        font-weight: 600;
        margin-bottom: 16px;
      }

      .card {
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 10px;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
        font-size: 0.95rem;
      }

      .actions {
        margin-top: 8px;
        display: flex;
        gap: 8px;
      }

      button {
        cursor: pointer;
        font-size: 0.9rem;
        line-height: 1.2;
        border-radius: 4px;
        font-weight: 600;
        border: none;
        padding: 8px 14px;
        transition: all 0.15s ease;
      }

      .approveBtn {
        background-color: #1e7b3a;
        color: #fff;
      }
      .approveBtn:hover {
        background-color: #165a2a;
      }

      .denyBtn {
        background-color: #b30000;
        color: #fff;
      }
      .denyBtn:hover {
        background-color: #800000;
      }

      .primaryButton {
        background-color: #5e001f;
        color: #fff;
        border: 1px solid #5e001f;
        margin-top: 16px;
      }
      .primaryButton:hover {
        background-color: #440017;
        box-shadow: 0 4px 10px rgba(68, 0, 23, 0.4);
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <img src="concordiaEmblem.png" alt="Concordia Emblem" />
      <h2>Concordia University — Booking Approvals</h2>
    </header>

    <!-- NEW: special requests section -->
    <h1>Pending Special Requests</h1>
    <div id="specialRequestsList"></div>

    <button id="goBack" class="primaryButton" type="button">
      Go Back To Dashboard
    </button>

    <script>
      document.getElementById("goBack").onclick = () => {
        location.href = "adminPage.html";
      };

      async function loadPending() {
        const list = document.getElementById("pendingList");
        list.innerHTML = "";
        try {
          const res = await fetch("/api/admin/pending-bookings");
          const data = await res.json();
          if (!data.success || !data.bookings.length) {
            list.innerHTML = "<p>No pending bookings.</p>";
            return;
          }
          data.bookings.forEach((b) => {
            const div = document.createElement("div");
            div.className = "card";
            div.innerHTML = `
              <strong>Student:</strong> ${b.username}<br/>
              <strong>Room:</strong> ${b.room}<br/>
              <strong>Date:</strong> ${b.date}<br/>
              <strong>Time:</strong> ${b.startTime} - ${b.endTime}<br/>
            `;
            const actions = document.createElement("div");
            actions.className = "actions";

            const approveBtn = document.createElement("button");
            approveBtn.className = "approveBtn";
            approveBtn.textContent = "Approve";
            approveBtn.onclick = async () => {
              const res = await fetch("/api/admin/approve/" + b.id, {
                method: "POST",
              });
              const d = await res.json();
              if (!d.success) {
                alert(d.message || "Error approving.");
                return;
              }
              loadPending();
            };

            const denyBtn = document.createElement("button");
            denyBtn.className = "denyBtn";
            denyBtn.textContent = "Deny";
            denyBtn.onclick = async () => {
              const res = await fetch("/api/admin/deny/" + b.id, {
                method: "POST",
              });
              const d = await res.json();
              if (!d.success) {
                alert(d.message || "Error denying.");
                return;
              }
              loadPending();
            };

            actions.appendChild(approveBtn);
            actions.appendChild(denyBtn);
            div.appendChild(actions);
            list.appendChild(div);
          });
        } catch (err) {
          console.error(err);
          list.innerHTML = "<p>Error loading pending bookings.</p>";
        }
      }

      async function loadSpecialRequests() {
        const list = document.getElementById("specialRequestsList");
        list.innerHTML = "";

        const adminUsername = localStorage.getItem("username") || "";

        try {
          const res = await fetch(
            "/api/special-request/pending?admin=" +
              encodeURIComponent(adminUsername)
          );
          const data = await res.json();

          if (!data.success || !data.requests.length) {
            list.innerHTML = "<p>No pending special requests.</p>";
            return;
          }

          data.requests.forEach((r) => {
            const div = document.createElement("div");
            div.className = "card";
            div.innerHTML = `
              <strong>Student:</strong> ${r.student}<br/>
              <strong>Admin:</strong> ${r.admin}<br/>
              <strong>Request:</strong> ${r.message}<br/>
              <strong>Hours:</strong> ${r.hours}<br/>
            `;

            const actions = document.createElement("div");
            actions.className = "actions";

            const approveReqBtn = document.createElement("button");
            approveReqBtn.className = "approveBtn";
            approveReqBtn.textContent = "Approve Request";
            approveReqBtn.onclick = async () => {
              const res = await fetch("/api/special-request/approve", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: r.id }),
              });
              const d = await res.json();
              if (!d.success) {
                alert(d.message || "Error approving special request.");
                return;
              }
              alert("Special request approved.");
              loadSpecialRequests();
            };

            const denyReqBtn = document.createElement("button");
            denyReqBtn.className = "denyBtn";
            denyReqBtn.textContent = "Deny Request";
            denyReqBtn.onclick = async () => {
              const res = await fetch("/api/special-request/deny", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: r.id }),
              });
              const d = await res.json();
              if (!d.success) {
                alert(d.message || "Error denying special request.");
                return;
              }
              alert("Special request denied.");
              loadSpecialRequests();
            };

            actions.appendChild(approveReqBtn);
            actions.appendChild(denyReqBtn);
            div.appendChild(actions);
            list.appendChild(div);
          });
        } catch (err) {
          console.error(err);
          list.innerHTML = "<p>Error loading special requests.</p>";
        }
      }

      // Load both normal bookings and special requests on page load
      loadPending();
      loadSpecialRequests();
    </script>
  </body>
</html>
